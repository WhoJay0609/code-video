  <script>
    (() => {
      "use strict";
      const WIDTH = 1280;
      const HEIGHT = 720;
      const DURATION = 20;
      const FPS = 30;
      const X0 = 112;
      const X1 = 912;
      const Y_BASE = { one: 280, two: 393, sum: 528 };
      const SCALE = 100;
      const AMPLITUDE = .38;
      const SIGMA = .78;
      const WAVELENGTH = 1.5;
      const PROBE_X = 5;

      // Storyboard: 0–3s introduce the two reference displacements and fixed probe;
      // 3–9.7s run a same-phase passage with a 0.7s marked reading freeze at t=6;
      // 9.45–10.25s visibly reset the initial conditions; 10.2–17.5s run an
      // opposite-phase passage with a second marked 0.7s reading freeze at t=13.5;
      // 17.5–20s hold a two-case recap. During either freeze, animation time advances
      // while the model's propagation time is held; the on-screen label states this.
      // Each wave is a translated analytic packet;
      // the dark path is computed sample by sample as the two signed values add.
      // Physics basis: https://openstax.org/books/university-physics-volume-1/pages/16-5-interference-of-waves
      const SCENES = [
        { at: 0, name: "建立两列参考位移" }, { at: 3, name: "同相相向传播" },
        { at: 6, name: "同相定格观察" }, { at: 9.45, name: "显式重设初态" },
        { at: 10.2, name: "反相相向传播" }, { at: 13.5, name: "反相定格观察" },
        { at: 17.5, name: "两种结果回顾" },
      ];
      const clamp = (value, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, value));
      const smooth = (value) => { const x = clamp(value); return x * x * (3 - 2 * x); };
      const el = (id) => document.getElementById(id);
      const p1Path = el("wave-one");
      const p2Path = el("wave-two");
      const sumPath = el("wave-sum");
      const playButton = document.querySelector("[data-play]");
      const restartButton = document.querySelector("[data-restart]");
      const fullscreenButton = document.querySelector("[data-fullscreen]");
      const slider = document.querySelector("#timeline");
      const readout = document.querySelector("[data-readout]");
      let currentTime = 0;
      let isPlaying = false;
      let frameId = 0;
      let playOrigin = 0;

      const mapX = (position) => X0 + (X1 - X0) * position / 10;
      const packet = (position, center, sign) => {
        const dx = position - center;
        const envelope = Math.exp(-.5 * (dx / SIGMA) ** 2);
        const carrier = Math.cos(2 * Math.PI * dx / WAVELENGTH);
        return sign * AMPLITUDE * envelope * carrier;
      };
      const formatValue = (value) => {
        const safe = Math.abs(value) < .005 ? 0 : value;
        return (safe >= 0 ? "+" : "−") + Math.abs(safe).toFixed(2);
      };
      const formatTime = (seconds) => {
        const whole = Math.floor(seconds);
        return "00:" + String(whole).padStart(2, "0") + "." + Math.floor((seconds - whole) * 10);
      };
      const pointValue = (position, center, sign) => packet(position, center, sign);
      const pathFor = (which, centerOne, centerTwo, signTwo) => {
        const samples = 400;
        let path = "";
        for (let i = 0; i <= samples; i += 1) {
          const position = 10 * i / samples;
          const first = packet(position, centerOne, 1);
          const second = packet(position, centerTwo, signTwo);
          const value = which === "one" ? first : which === "two" ? second : first + second;
          const base = Y_BASE[which];
          const x = X0 + (X1 - X0) * i / samples;
          const y = base - SCALE * value;
          path += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
        }
        return path.trim();
      };
      const drawBar = (id, value) => {
        const bar = el(id);
        const center = 1102;
        const width = Math.min(61, Math.abs(value) / .76 * 61);
        bar.setAttribute("x", String(value < 0 ? center - width : center));
        bar.setAttribute("width", String(width));
      };
      const setOpacity = (id, value) => el(id).setAttribute("opacity", String(clamp(value)));
      const updateControls = () => {
        const ended = currentTime >= DURATION;
        playButton.textContent = isPlaying ? "暂停" : ended ? "再看一次" : "播放";
        playButton.setAttribute("aria-label", isPlaying ? "暂停动画" : ended ? "从头再看一次" : "播放动画");
        slider.value = String(Math.round(currentTime * 1000));
        readout.textContent = formatTime(currentTime) + " / " + formatTime(DURATION);
      };

      function drawFrame(seconds) {
        const t = clamp(seconds, 0, DURATION);
        currentTime = t;
        let centerOne;
        let centerTwo;
        let signTwo;
        let freeze = "";
        let firstElapsed;
        if (t < 6) firstElapsed = clamp(t - 3, 0, 3);
        else if (t < 6.7) { firstElapsed = 3; freeze = "same"; }
        else firstElapsed = clamp(3 + t - 6.7, 0, 6);
        const firstCase = t < 9.65;
        if (firstCase) {
          centerOne = 3 + (2 / 3) * firstElapsed;
          centerTwo = 7 - (2 / 3) * firstElapsed;
          signTwo = 1;
        } else {
          let secondElapsed;
          if (t < 13.5) secondElapsed = clamp(t - 10.2, 0, 3.3);
          else if (t < 14.2) { secondElapsed = 3.3; freeze = "opposite"; }
          else secondElapsed = clamp(3.3 + t - 14.2, 0, 6.6);
          const speed = 2.7 / 3.3;
          centerOne = 2.8 + speed * secondElapsed;
          centerTwo = 8.2 - speed * secondElapsed;
          signTwo = -1;
        }

        const oldField = 1 - smooth((t - 9.42) / .24);
        const newField = smooth((t - 9.92) / .32);
        const fieldOpacity = t < 9.65 ? oldField : newField;
        setOpacity("wave-field", fieldOpacity);
        const transitionOpacity = smooth((t - 9.4) / .18) * (1 - smooth((t - 10.25) / .18));
        setOpacity("transition-card", transitionOpacity);

        const isFirstCase = t < 9.65;
        const bothPassed = centerOne > PROBE_X + SIGMA && centerTwo < PROBE_X - SIGMA;
        el("case-pill").setAttribute("fill", isFirstCase ? "#e9f1f5" : "#f8ece7");
        el("case-dot").setAttribute("fill", isFirstCase ? "#347fb7" : "#e17c66");
        el("case-title").setAttribute("fill", isFirstCase ? "#315c77" : "#a35f4e");
        el("case-title").textContent = freeze === "same" ? "定格观察 · 同相" : freeze === "opposite" ? "定格观察 · 反相" : isFirstCase ? "情形一 · 同相" : "情形二 · 反相";
        el("case-note").textContent = freeze === "same"
          ? "传播示意暂停 0.7 秒 · 同号波峰重合"
          : freeze === "opposite"
            ? "传播示意暂停 0.7 秒 · 整列波包重合"
            : t >= 9.42 && t <= 10.25
              ? "换一组初态 · 重新开始第二轮"
              : bothPassed ? "两列波包已通过 P · 仍继续传播"
              : isFirstCase ? "相同波包完全重合时增强" : "反相波包完全重合时抵消";
        el("footer-main").textContent = freeze
          ? "定格观察 · 传播示意暂停 0.7 秒；动画时间继续"
          : t < 17.5
            ? "理想线性介质示意 · 位移相消不表示波或能量消失"
            : "位移逐点相加；波包相遇后仍继续传播。";

        p1Path.setAttribute("d", pathFor("one", centerOne, centerTwo, signTwo));
        p2Path.setAttribute("d", pathFor("two", centerOne, centerTwo, signTwo));
        sumPath.setAttribute("d", pathFor("sum", centerOne, centerTwo, signTwo));

        const v1 = pointValue(PROBE_X, centerOne, 1);
        const v2 = pointValue(PROBE_X, centerTwo, signTwo);
        const total = v1 + v2;
        el("probe-one").setAttribute("cy", String(Y_BASE.one - SCALE * v1));
        el("probe-two").setAttribute("cy", String(Y_BASE.two - SCALE * v2));
        el("probe-sum").setAttribute("cy", String(Y_BASE.sum - SCALE * total));
        el("value-one").textContent = formatValue(v1);
        el("value-two").textContent = formatValue(v2);
        el("value-sum").textContent = formatValue(total);
        drawBar("bar-one", v1);
        drawBar("bar-two", v2);
        drawBar("bar-sum", total);

        const sameDirection = v1 * v2 >= 0;
        const meaningful = Math.abs(v1) + Math.abs(v2) > .055;
        const wholePacketOverlap = signTwo < 0 && Math.abs(centerOne - centerTwo) < 1e-9;
        const tag = el("result-tag");
        const label = el("result-label");
        const dot = el("result-dot");
        const bothApproaching = centerOne < PROBE_X - SIGMA && centerTwo > PROBE_X + SIGMA;
        tag.setAttribute("fill", wholePacketOverlap ? "#e9f2ec" : !meaningful ? "#eef0ec" : sameDirection ? "#e9f2ec" : "#f8eee9");
        label.setAttribute("fill", wholePacketOverlap ? "#47755a" : !meaningful ? "#727e78" : sameDirection ? "#47755a" : "#a45f4c");
        dot.setAttribute("fill", wholePacketOverlap ? "#5c9871" : !meaningful ? "#929b94" : sameDirection ? "#5c9871" : "#d47c62");
        label.textContent = wholePacketOverlap
          ? "完全抵消 · 波包重合"
          : !meaningful
            ? bothPassed ? "已通过 P · 继续传播" : "P 点位移很小"
            : sameDirection ? "P 点同向 · 合位移增强" : "P 点异号 · 部分抵消";
        el("readout-note").textContent = wholePacketOverlap
          ? "逐点等幅反号，合位移为零。"
          : bothPassed
            ? "已通过 P，仍继续传播。"
            : bothApproaching
              ? "两列波正向 P 传播。"
              : sameDirection
                ? "两项同号，合位移增强。"
                : "两项异号，位移代数相加。";

        const ending = smooth((t - 17.35) / .35);
        setOpacity("probe-card", (1 - ending) * fieldOpacity);
        setOpacity("summary-card", ending);
        updateControls();
      }

      function pause() {
        if (frameId) cancelAnimationFrame(frameId);
        frameId = 0;
        isPlaying = false;
        updateControls();
      }
      function paint(seconds) {
        drawFrame(seconds);
      }
      function advance(timestamp) {
        if (!isPlaying) return;
        const next = (timestamp - playOrigin) / 1000;
        if (next >= DURATION) {
          paint(DURATION);
          pause();
          return;
        }
        paint(next);
        frameId = requestAnimationFrame(advance);
      }
      const ready = (document.fonts ? document.fonts.ready : Promise.resolve()).then(() =>
        new Promise((resolve) => requestAnimationFrame(() => resolve()))
      ).then(() => {
        drawFrame(0);
      });
      const video = {
        width: WIDTH,
        height: HEIGHT,
        duration: DURATION,
        fps: FPS,
        ready,
        async seek(seconds) {
          await ready;
          const value = Number(seconds);
          if (!Number.isFinite(value)) throw new TypeError("seek(seconds) requires a finite number");
          pause();
          paint(value);
          await new Promise((resolve) => requestAnimationFrame(() => resolve()));
        },
        play() {
          if (isPlaying) return;
          if (currentTime >= DURATION) paint(0);
          isPlaying = true;
          playOrigin = performance.now() - currentTime * 1000;
          frameId = requestAnimationFrame(advance);
          updateControls();
        },
        pause,
      };
      Object.defineProperties(video, {
        time: { enumerable: true, get: () => currentTime },
        playing: { enumerable: true, get: () => isPlaying },
      });
      window.__video = video;
      playButton.addEventListener("click", () => isPlaying ? video.pause() : video.play());
      restartButton.addEventListener("click", async () => { await video.seek(0); video.play(); });
      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.querySelector(".preview").requestFullscreen) await document.querySelector(".preview").requestFullscreen();
        } catch (error) {
          fullscreenButton.textContent = "无法全屏";
          window.setTimeout(() => { fullscreenButton.textContent = document.fullscreenElement ? "退出全屏" : "全屏"; }, 1500);
        }
      });
      document.addEventListener("fullscreenchange", () => {
        const active = Boolean(document.fullscreenElement);
        fullscreenButton.textContent = active ? "退出全屏" : "全屏";
        fullscreenButton.setAttribute("aria-label", active ? "退出全屏观看" : "全屏观看");
      });
      slider.addEventListener("input", () => { void video.seek(Number(slider.value) / 1000); });
      if (new URLSearchParams(location.search).get("autoplay") !== "0") ready.then(() => video.play());
    })();
  </script>
</body>
</html>
